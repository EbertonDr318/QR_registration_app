{% extends "base.html" %}

{% block title %}Mi QR · RMS{% endblock %}

{% block content %}
  <section class="panel qr-card">
    <p class="eyebrow">IDENTIFICACIÓN PERSONAL</p>
    <h1>Mi código QR</h1>
    <img src="{{ url_for('account.my_qr_api') }}" alt="Código QR de {{ persona.nombres }}" />
    <p><b>{{ persona.nombres }} {{ persona.apellidos }}</b><br />{{ persona.codigo }}</p>
    <p>{{ iglesia.nombre }}</p>
    <p class="hint">No compartas esta identificación con otras personas.</p>
  </section>
{% endblock %}
