{% extends "base.html" %}

{% block title %}Mi información · RMS{% endblock %}

{% block content %}
  <div class="heading">
    <div>
      <p class="eyebrow">PERFIL</p>
      <h1>Mi información</h1>
    </div>
  </div>
  <section class="panel">
    <form method="post" action="{{ url_for('account.update_my_information') }}" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label>Nombres<input name="nombres" value="{{ persona.nombres }}" maxlength="80" required /></label>
      <label>Apellidos<input name="apellidos" value="{{ persona.apellidos }}" maxlength="80" required /></label>
      <label>Teléfono<input name="telefono" value="{{ persona.telefono or '' }}" maxlength="25" /></label>
      <label>Sede<input name="sede" value="{{ persona.sede or '' }}" maxlength="80" /></label>
      <label>Grupo<input name="grupo" value="{{ persona.grupo or '' }}" maxlength="80" /></label>
      <div class="readonly-setting">
        <span><b>Código:</b> {{ persona.codigo }}</span>
        <span><b>Correo Google:</b> {{ persona.correo or '—' }}</span>
        <span><b>Iglesia:</b> {{ iglesia.nombre }}</span>
      </div>
      <div class="full"><button class="button" type="submit">Guardar mi información</button></div>
    </form>
  </section>
{% endblock %}
